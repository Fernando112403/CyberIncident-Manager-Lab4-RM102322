<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías de Incidentes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CyberIncident Manager</a>

        <div>
            <a class="btn btn-outline-light btn-sm" href="/categorias">Categorías</a>
            <a class="btn btn-outline-light btn-sm" href="/incidentes">Incidentes</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Categorías de Incidentes</h2>
        <a href="/categorias/crear" class="btn btn-primary">Nueva Categoría</a>
    </div>

    <table class="table table-bordered table-striped bg-white">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Nivel de Riesgo</th>
                <th>Estado</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="categoria : ${categorias}">
                <td th:text="${categoria.id}"></td>
                <td th:text="${categoria.nombre}"></td>
                <td th:text="${categoria.descripcion}"></td>
                <td th:text="${categoria.nivelRiesgo}"></td>
                <td>
                    <span th:if="${categoria.estado}" class="badge bg-success">Activo</span>
                    <span th:unless="${categoria.estado}" class="badge bg-secondary">Inactivo</span>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
