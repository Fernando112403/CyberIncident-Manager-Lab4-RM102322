<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Incidente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">CyberIncident Manager</a>

        <div>
            <a class="btn btn-outline-light btn-sm" href="/categorias">Categorías</a>
            <a class="btn btn-outline-light btn-sm" href="/incidentes">Incidentes</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4>Nuevo Incidente de Ciberseguridad</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/incidentes/guardar}" th:object="${incidente}" method="post">

                <div class="mb-3">
                    <label class="form-label">Título del Incidente</label>
                    <input type="text" th:field="*{titulo}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de Reporte</label>
                    <input type="date" th:field="*{fechaReporte}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Criticidad</label>
                    <select th:field="*{criticidad}" class="form-select" required>
                        <option value="">Seleccione...</option>
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                        <option value="Crítica">Crítica</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select th:field="*{estado}" class="form-select" required>
                        <option value="">Seleccione...</option>
                        <option value="Reportado">Reportado</option>
                        <option value="En investigación">En investigación</option>
                        <option value="Contenido">Contenido</option>
                        <option value="Resuelto">Resuelto</option>
                        <option value="Cerrado">Cerrado</option>
                        <option value="Falso positivo">Falso positivo</option>
                    </select>
                </div>
                
<div class="mb-3">
                   <div class="mb-3">
    <label class="form-label">Activo</label>
    <select th:field="*{activo}" class="form-select">
        <option th:value="true">Sí</option>
        <option th:value="false">No</option>
    </select>
</div>

                <div class="mb-3">
                    <label class="form-label">Usuario que Reporta</label>
                    <input type="text" th:field="*{usuarioReporta}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Equipo Afectado</label>
                    <input type="text" th:field="*{equipoAfectado}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select th:field="*{categoria}" class="form-select" required>
                        <option value="">Seleccione una categoría...</option>
                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.id}"
                                th:text="${categoria.nombre}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">Guardar</button>
                <a href="/incidentes" class="btn btn-secondary">Cancelar</a>

            </form>
        </div>
    </div>

</div>

</body>
</html>
